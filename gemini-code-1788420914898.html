<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小學乘法大挑戰 (0-10)</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
    <style>
        :root {
            --primary-color: #4A90E2;
            --primary-dark: #357ABD;
            --secondary-color: #FF9F43;
            --accent-color: #2ECC71;
            --danger-color: #EE5253;
            --bg-color: #EBF5FB;
            --card-bg: #FFFFFF;
            --text-color: #2C3E50;
            --font-family: 'PingFang TC', 'Microsoft JhengHei', 'Heiti TC', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: var(--font-family);
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }

        .container {
            width: 100%;
            max-width: 550px;
            background: var(--card-bg);
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            padding: 25px;
            position: relative;
            overflow: hidden;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 1.8rem;
            color: var(--primary-color);
            margin-bottom: 5px;
        }

        p.subtitle {
            font-size: 0.95rem;
            color: #7F8C8D;
        }

        /* 視窗切換 */
        .screen {
            display: none;
        }
        .screen.active {
            display: block;
        }

        /* 輸入表單 */
        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            font-size: 1.1rem;
        }

        select, input {
            width: 100%;
            padding: 12px 15px;
            font-size: 1.1rem;
            border: 2px solid #CBD5E0;
            border-radius: 12px;
            outline: none;
            transition: border-color 0.2s;
            background-color: #F8FAFC;
        }

        select:focus, input:focus {
            border-color: var(--primary-color);
        }

        .btn {
            display: block;
            width: 100%;
            padding: 14px;
            font-size: 1.2rem;
            font-weight: bold;
            color: white;
            background-color: var(--primary-color);
            border: none;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(74, 144, 226, 0.3);
            transition: all 0.2s;
            text-align: center;
        }

        .btn:active {
            transform: translateY(2px);
            box-shadow: none;
        }

        .btn-secondary {
            background-color: var(--secondary-color);
            box-shadow: 0 4px 6px rgba(255, 159, 67, 0.3);
            margin-top: 10px;
        }

        /* 遊戲介面 */
        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            font-size: 1.1rem;
            font-weight: bold;
        }

        .badge {
            background-color: #E2E8F0;
            padding: 6px 12px;
            border-radius: 20px;
            color: var(--text-color);
        }

        .timer-container {
            width: 100%;
            height: 12px;
            background-color: #EDF2F7;
            border-radius: 6px;
            overflow: hidden;
            margin-bottom: 25px;
        }

        .timer-bar {
            height: 100%;
            width: 100%;
            background-color: var(--accent-color);
            transition: width 0.1s linear, background-color 0.3s;
        }

        .equation-box {
            font-size: 2.8rem;
            font-weight: bold;
            text-align: center;
            margin: 20px 0;
            letter-spacing: 2px;
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .answer-input-box {
            width: 90px;
            height: 65px;
            font-size: 2.5rem;
            text-align: center;
            border: 3px solid var(--primary-color);
            border-radius: 12px;
            background-color: #FFF9C4;
            color: #D35400;
            font-weight: bold;
        }

        /* 虛擬數字鍵盤 */
        .numpad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 20px;
        }

        .num-btn {
            padding: 12px;
            font-size: 1.5rem;
            font-weight: bold;
            background-color: #F1F5F9;
            border: 1px solid #CBD5E0;
            border-radius: 10px;
            cursor: pointer;
            text-align: center;
            transition: background 0.1s;
        }

        .num-btn:active {
            background-color: #E2E8F0;
        }

        .num-btn.submit-btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
        }

        .num-btn.delete-btn {
            background-color: #E2E8F0;
            color: var(--danger-color);
        }

        /* 結算彈窗 (Modal) */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-content {
            width: 100%;
            max-width: 450px;
            border-radius: 20px;
            padding: 30px 20px;
            text-align: center;
            position: relative;
            box-shadow: 0 15px 30px rgba(0,0,0,0.3);
            /* 指定以 happy.png 為背景圖片，相對路徑存放於同一層級 */
            background-image: url('happy.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            color: #2C3E50;
        }

        /* 半透明遮罩確保背景圖上的文字清晰 */
        .modal-inner {
            background-color: rgba(255, 255, 255, 0.92);
            padding: 25px 20px;
            border-radius: 16px;
            backdrop-filter: blur(3px);
        }

        .modal-title {
            font-size: 2rem;
            color: #D35400;
            margin-bottom: 10px;
            font-weight: 800;
        }

        .final-score {
            font-size: 3.5rem;
            font-weight: 900;
            color: var(--primary-color);
            margin: 15px 0;
        }

        /* 排行榜樣式 */
        .leaderboard-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        .leaderboard-table th, .leaderboard-table td {
            padding: 10px;
            text-align: center;
            border-bottom: 1px solid #E2E8F0;
        }

        .leaderboard-table th {
            background-color: var(--primary-color);
            color: white;
        }

        .leaderboard-container {
            max-height: 250px;
            overflow-y: auto;
            margin-bottom: 15px;
            border: 1px solid #E2E8F0;
            border-radius: 8px;
        }

        .feedback-msg {
            height: 24px;
            text-align: center;
            font-weight: bold;
            font-size: 1.2rem;
            margin-top: 10px;
        }

        @media (max-width: 480px) {
            .equation-box { font-size: 2.2rem; }
            .answer-input-box { width: 75px; height: 55px; font-size: 2rem; }
            h1 { font-size: 1.5rem; }
            .container { padding: 18px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>✏️ 乘法大挑戰 🎯</h1>
            <p class="subtitle">小學二年級每日自主學習小遊戲 (0-10乘法)</p>
        </header>

        <div id="login-screen" class="screen active">
            <div class="form-group">
                <label for="class-select">🏫 請選擇班別：</label>
                <select id="class-select">
                    <option value="3a">3a 班</option>
                    <option value="3b">3b 班</option>
                    <option value="3c">3c 班</option>
                    <option value="3d">3d 班</option>
                    <option value="3e">3e 班</option>
                </select>
            </div>

            <div class="form-group">
                <label for="student-no">🔢 請選擇學號 (1-30)：</label>
                <select id="student-no"></select>
            </div>

            <button class="btn" onclick="startGame()">🚀 開始挑戰</button>
            <button class="btn btn-secondary" onclick="showLeaderboardScreen()">🏆 查看排行榜</button>
        </div>

        <div id="game-screen" class="screen">
            <div class="game-header">
                <span class="badge" id="player-info-display">3a (01號)</span>
                <span class="badge" id="question-progress">題目: 1 / 10</span>
                <span class="badge" id="score-display">得分: 0</span>
            </div>

            <div class="timer-container">
                <div id="timer-bar" class="timer-bar"></div>
            </div>

            <div class="equation-box" id="equation-display"></div>
            <div class="feedback-msg" id="feedback-msg"></div>

            <div class="numpad">
                <button class="num-btn" onclick="pressNum(1)">1</button>
                <button class="num-btn" onclick="pressNum(2)">2</button>
                <button class="num-btn" onclick="pressNum(3)">3</button>
                <button class="num-btn" onclick="pressNum(4)">4</button>
                <button class="num-btn" onclick="pressNum(5)">5</button>
                <button class="num-btn" onclick="pressNum(6)">6</button>
                <button class="num-btn" onclick="pressNum(7)">7</button>
                <button class="num-btn" onclick="pressNum(8)">8</button>
                <button class="num-btn" onclick="pressNum(9)">9</button>
                <button class="num-btn delete-btn" onclick="pressDelete()">⌫ 刪除</button>
                <button class="num-btn" onclick="pressNum(0)">0</button>
                <button class="num-btn submit-btn" onclick="submitAnswer()">確認 ↵</button>
            </div>
        </div>

        <div id="leaderboard-screen" class="screen">
            <h2 style="text-align: center; margin-bottom: 15px; color: var(--primary-color);">🏆 雲端榮譽榜</h2>
            <div class="leaderboard-container">
                <table class="leaderboard-table">
                    <thead>
                        <tr>
                            <th>排名</th>
                            <th>班別 / 學號</th>
                            <th>得分</th>
                        </tr>
                    </thead>
                    <tbody id="leaderboard-body">
                        <tr><td colspan="3">載入中...</td></tr>
                    </tbody>
                </table>
            </div>
            <button class="btn" onclick="showScreen('login-screen')">🔙 返回主頁</button>
        </div>
    </div>

    <div id="summary-modal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-inner">
                <div class="modal-title">🎉 挑戰完成！</div>
                <p id="summary-player" style="font-size: 1.1rem; color: #555;"></p>
                <div class="final-score" id="summary-score">8 / 10</div>
                <p id="summary-eval" style="font-size: 1.2rem; font-weight: bold; margin-bottom: 20px; color: var(--secondary-color);"></p>
                <button class="btn" onclick="restartGame()">🔄 再玩一次</button>
                <button class="btn btn-secondary" onclick="closeModalAndShowLeaderboard()">🏆 查看排行榜</button>
            </div>
        </div>
    </div>

    <script>
        /* ==========================================
           1. Firebase 雲端資料庫設定
           ========================================== */
        const firebaseConfig = {
            // 如需使用真實跨裝置雲端排行榜，請前往 Firebase Console 免費建立 Realtime Database 並貼上設定：
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT.firebaseapp.com",
            databaseURL: "https://YOUR_PROJECT-default-rtdb.firebaseio.com",
            projectId: "YOUR_PROJECT",
            storageBucket: "YOUR_PROJECT.appspot.com",
            messagingSenderId: "123456789",
            appId: "YOUR_APP_ID"
        };

        let isFirebaseActive = false;
        try {
            if (firebaseConfig.databaseURL && !firebaseConfig.databaseURL.includes("YOUR_PROJECT")) {
                firebase.initializeApp(firebaseConfig);
                isFirebaseActive = true;
            }
        } catch(e) {
            console.log("Firebase 未設定，轉用本地記憶體/LocalStorage 模式。");
        }

        /* ==========================================
           2. Web Audio API 音效生成器 (無須外部檔)
           ========================================== */
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx;

        function initAudio() {
            if (!audioCtx) audioCtx = new AudioContext();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playCorrectSound() {
            try {
                initAudio();
                const now = audioCtx.currentTime;
                const osc1 = audioCtx.createOscillator();
                const gain1 = audioCtx.createGain();
                osc1.type = 'sine';
                osc1.frequency.setValueAtTime(523.25, now); // C5
                gain1.gain.setValueAtTime(0.3, now);
                gain1.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                osc1.connect(gain1);
                gain1.connect(audioCtx.destination);
                osc1.start(now);
                osc1.stop(now + 0.3);

                const osc2 = audioCtx.createOscillator();
                const gain2 = audioCtx.createGain();
                osc2.type = 'sine';
                osc2.frequency.setValueAtTime(659.25, now + 0.12); // E5
                gain2.gain.setValueAtTime(0.3, now + 0.12);
                gain2.gain.exponentialRampToValueAtTime(0.01, now + 0.45);
                osc2.connect(gain2);
                gain2.connect(audioCtx.destination);
                osc2.start(now + 0.12);
                osc2.stop(now + 0.45);
            } catch(e) {}
        }

        function playWrongSound() {
            try {
                initAudio();
                const now = audioCtx.currentTime;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(180, now);
                osc.frequency.linearRampToValueAtTime(110, now + 0.35);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + 0.35);
            } catch(e) {}
        }

        /* ==========================================
           3. 遊戲核心邏輯
           ========================================== */
        let currentClass = "3a";
        let currentStudentNo = "1";
        let score = 0;
        let currentQuestionIndex = 0;
        const TOTAL_QUESTIONS = 10;
        let questions = [];
        let timerInterval = null;
        let timeLeft = 10;

        window.onload = function() {
            const studentSelect = document.getElementById('student-no');
            for (let i = 1; i <= 30; i++) {
                let opt = document.createElement('option');
                opt.value = i;
                opt.textContent = i + " 號";
                studentSelect.appendChild(opt);
            }
        };

        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        function startGame() {
            initAudio();
            currentClass = document.getElementById('class-select').value;
            currentStudentNo = document.getElementById('student-no').value;
            score = 0;
            currentQuestionIndex = 0;

            generateQuestions();
            showScreen('game-screen');
            loadQuestion();
        }

        function generateQuestions() {
            questions = [];
            for (let i = 0; i < TOTAL_QUESTIONS; i++) {
                const a = Math.floor(Math.random() * 11);
                const b = Math.floor(Math.random() * 11);
                const c = a * b;
                const missingType = Math.floor(Math.random() * 3);

                let expectedAnswer;
                if (missingType === 0) expectedAnswer = c;
                else if (missingType === 1) expectedAnswer = a;
                else expectedAnswer = b;

                questions.push({ a, b, c, missingType, expectedAnswer });
            }
        }

        function loadQuestion() {
            if (currentQuestionIndex >= TOTAL_QUESTIONS) {
                endGame();
                return;
            }

            const q = questions[currentQuestionIndex];
            const display = document.getElementById('equation-display');
            document.getElementById('player-info-display').textContent = `${currentClass.toUpperCase()} (${currentStudentNo}號)`;
            document.getElementById('question-progress').textContent = `題目: ${currentQuestionIndex + 1} / ${TOTAL_QUESTIONS}`;
            document.getElementById('score-display').textContent = `得分: ${score}`;
            document.getElementById('feedback-msg').textContent = '';

            if (q.missingType === 0) {
                display.innerHTML = `${q.a} × ${q.b} = <input type="number" id="user-answer" class="answer-input-box" readonly>`;
            } else if (q.missingType === 1) {
                display.innerHTML = `<input type="number" id="user-answer" class="answer-input-box" readonly> × ${q.b} = ${q.c}`;
            } else {
                display.innerHTML = `${q.a} × <input type="number" id="user-answer" class="answer-input-box" readonly> = ${q.c}`;
            }

            startTimer();
        }

        function startTimer() {
            clearInterval(timerInterval);
            const timerBar = document.getElementById('timer-bar');
            timerBar.style.width = '100%';
            timerBar.style.backgroundColor = 'var(--accent-color)';

            const startTime = Date.now();
            const duration = 10000;

            timerInterval = setInterval(() => {
                const elapsed = Date.now() - startTime;
                const remaining = duration - elapsed;
                
                if (remaining <= 0) {
                    clearInterval(timerInterval);
                    timerBar.style.width = '0%';
                    handleTimeout();
                } else {
                    const percentage = (remaining / duration) * 100;
                    timerBar.style.width = percentage + '%';
                    if (percentage < 30) {
                        timerBar.style.backgroundColor = 'var(--danger-color)';
                    }
                }
            }, 100);
        }

        function pressNum(num) {
            const input = document.getElementById('user-answer');
            if (input && input.value.length < 3) {
                input.value += num;
            }
        }

        function pressDelete() {
            const input = document.getElementById('user-answer');
            if (input) input.value = input.value.slice(0, -1);
        }

        function submitAnswer() {
            const input = document.getElementById('user-answer');
            if (!input || input.value === '') return;

            clearInterval(timerInterval);
            const userAns = parseInt(input.value, 10);
            const q = questions[currentQuestionIndex];
            const feedback = document.getElementById('feedback-msg');

            if (userAns === q.expectedAnswer) {
                score++;
                playCorrectSound();
                feedback.style.color = "var(--accent-color)";
                feedback.textContent = "✨ 答對了！加1分！";
            } else {
                playWrongSound();
                feedback.style.color = "var(--danger-color)";
                feedback.textContent = `❌ 答錯了！正確答案是 ${q.expectedAnswer}`;
            }

            disableInputs();
            setTimeout(() => {
                currentQuestionIndex++;
                loadQuestion();
            }, 1200);
        }

        function handleTimeout() {
            playWrongSound();
            const feedback = document.getElementById('feedback-msg');
            const q = questions[currentQuestionIndex];
            feedback.style.color = "var(--danger-color)";
            feedback.textContent = `⏰ 時間到！正確答案是 ${q.expectedAnswer}`;

            disableInputs();
            setTimeout(() => {
                currentQuestionIndex++;
                loadQuestion();
            }, 1200);
        }

        function disableInputs() {
            const btns = document.querySelectorAll('.numpad button');
            btns.forEach(b => b.disabled = true);
            setTimeout(() => {
                btns.forEach(b => b.disabled = false);
            }, 1200);
        }

        document.addEventListener('keydown', function(e) {
            const gameScreen = document.getElementById('game-screen');
            if (!gameScreen.classList.contains('active')) return;

            if (e.key >= '0' && e.key <= '9') pressNum(parseInt(e.key));
            else if (e.key === 'Backspace') pressDelete();
            else if (e.key === 'Enter') submitAnswer();
        });

        /* ==========================================
           4. 結算與排行榜
           ========================================== */
        function endGame() {
            clearInterval(timerInterval);
            
            document.getElementById('summary-player').textContent = `班別：${currentClass.toUpperCase()}  |  學號：${currentStudentNo} 號`;
            document.getElementById('summary-score').textContent = `${score} / 10`;

            let evalText = "";
            if (score === 10) evalText = "🌟 太厲害了！你是乘法小達人！ 🌟";
            else if (score >= 7) evalText = "👍 做得好！繼續保持！";
            else if (score >= 5) evalText = "💪 還不錯，再多練習一下會更好！";
            else evalText = "📖 不要灰心，每天練習一定會進步！";

            document.getElementById('summary-eval').textContent = evalText;
            document.getElementById('summary-modal').classList.add('active');

            saveScore(currentClass.toUpperCase(), currentStudentNo, score);
        }

        function restartGame() {
            document.getElementById('summary-modal').classList.remove('active');
            startGame();
        }

        function closeModalAndShowLeaderboard() {
            document.getElementById('summary-modal').classList.remove('active');
            showLeaderboardScreen();
        }

        function saveScore(cls, no, scoreVal) {
            const record = {
                class: cls,
                studentNo: no,
                score: scoreVal,
                timestamp: Date.now()
            };

            if (isFirebaseActive) {
                firebase.database().ref('leaderboard').push(record);
            } else {
                let localData = JSON.parse(localStorage.getItem('multiplication_scores') || '[]');
                localData.push(record);
                localStorage.setItem('multiplication_scores', JSON.stringify(localData));
            }
        }

        function showLeaderboardScreen() {
            showScreen('leaderboard-screen');
            const tbody = document.getElementById('leaderboard-body');
            tbody.innerHTML = '<tr><td colspan="3">載入中...</td></tr>';

            if (isFirebaseActive) {
                firebase.database().ref('leaderboard').orderByChild('score').limitToLast(20).once('value')
                    .then(snapshot => {
                        let data = [];
                        snapshot.forEach(child => {
                            data.push(child.val());
                        });
                        data.reverse();
                        renderLeaderboard(data);
                    })
                    .catch(() => {
                        loadLocalLeaderboard();
                    });
            } else {
                loadLocalLeaderboard();
            }
        }

        function loadLocalLeaderboard() {
            let localData = JSON.parse(localStorage.getItem('multiplication_scores') || '[]');
            localData.sort((a, b) => b.score - a.score || b.timestamp - a.timestamp);
            renderLeaderboard(localData.slice(0, 20));
        }

        function renderLeaderboard(list) {
            const tbody = document.getElementById('leaderboard-body');
            tbody.innerHTML = '';

            if (list.length === 0) {
                tbody.innerHTML = '<tr><td colspan="3">暫無紀錄，快來成為第一個挑戰者吧！</td></tr>';
                return;
            }

            list.forEach((item, index) => {
                const tr = document.createElement('tr');
                let rankIcon = index + 1;
                if (index === 0) rankIcon = '🥇 1';
                else if (index === 1) rankIcon = '🥈 2';
                else if (index === 2) rankIcon = '🥉 3';

                tr.innerHTML = `
                    <td><strong>${rankIcon}</strong></td>
                    <td>${item.class} 班 (${item.studentNo}號)</td>
                    <td><strong style="color:var(--primary-color);">${item.score} 分</strong></td>
                `;
                tbody.appendChild(tr);
            });
        }
    </script>
</body>
</html>
